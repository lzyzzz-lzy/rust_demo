[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.0"
actix-cors = "0.6"
actix-multipart = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
env_logger = "0.9"
log = "0.4"
dotenv = "0.15"
uuid = { version = "1.0", features = ["v4"] }
sanitize-filename = "0.4"
reqwest = { version = "0.11", features = ["json"] }
async-stream = "0.3"
